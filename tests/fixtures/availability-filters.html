<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic availability controls</title></head>
<body>
<!-- Synthetic offline regression fixture. See README.md in this directory. -->
<div class="selected_filter"><ul aria-label="Current Filters"><li><span>Available to book</span><span aria-hidden="true"> ×</span></li><li class="clear_filter" data-cy="FilterSidebar-clearButton">Clear all filters</li></ul></div>
<div aria-label="Filter products by Availability">
  <label>Available to book<input aria-label="Remove filter Available to book." data-cy="FilterDefault-checkbox" title="Available to book" type="checkbox" value="179" name="Available to book-179" checked></label>
  <label>Available in lottery<input aria-label="Apply filter Available in lottery." data-cy="FilterDefault-checkbox" title="Available in lottery" type="checkbox" value="336" name="Available in lottery-336"></label>
  <label>Occupied<input aria-label="Apply filter Occupied." data-cy="FilterDefault-checkbox" title="Occupied" type="checkbox" value="180" name="Occupied-180"></label>
</div>
<div aria-label="Filter products by City"></div>
</body>
</html>
